# SonarCloud automatic analysis configuration (sonar-project.properties is ignored)

# submodules, not our code
sonar.exclusions=test-harness/**,spec/**,schemas/**

# Exclude test files from duplication detection
# flag_evaluator_v1.go is intentionally similar to v2; the duplication is kept because the file is temporary
sonar.cpd.exclusions=**/*_test.go,test/**,test-harness/**,**/flag_evaluator_v1.go
